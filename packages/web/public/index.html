<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Peanut</title>
    <style>
      @font-face {
        font-family: "Google Sans";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("/fonts/google-sans-latin-ext.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Google Sans";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("/fonts/google-sans.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Google Sans";
        font-style: italic;
        font-weight: 400 700;
        font-display: swap;
        src: url("/fonts/google-sans-italic-latin-ext.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Google Sans";
        font-style: italic;
        font-weight: 400 700;
        font-display: swap;
        src: url("/fonts/google-sans-italic.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      :root {
        --accent: #5a5f9e;
        --ink: #2b2e3a;
        --muted: #747b8c;
        --line: #d9dce4;
        --paper: #f5f6f9;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Google Sans", system-ui, sans-serif;
        color: var(--ink);
        background: var(--paper);
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 20px;
        background: #fff;
        border-bottom: 1px solid var(--line);
      }
      .wordmark { font-weight: 700; color: var(--accent); }
      .title { color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .people { position: relative; display: flex; }
      .people-icon { display: grid; place-items: center; padding: 4px; color: var(--muted); }
      .people-icon svg { width: 20px; height: 20px; }
      .people:hover .people-icon { color: var(--accent); }
      /* Hover intent without scripts: the fade is an opacity
         transition, the exit timer is its delay, and visibility flips
         after the fade so a hidden menu takes no hover. The top
         padding is a transparent bridge that keeps the hover alive
         between the icon and the panel. */
      .people-menu {
        position: absolute;
        top: 100%;
        right: -8px;
        padding-top: 10px;
        opacity: 0;
        visibility: hidden;
        transition: opacity 160ms ease 300ms, visibility 0s linear 460ms;
        z-index: 20;
      }
      .people:hover .people-menu, .people-menu:hover {
        opacity: 1;
        visibility: visible;
        transition: opacity 160ms ease;
      }
      .people-panel {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 4px 14px rgba(43, 46, 58, 0.12);
        padding: 8px;
        min-width: 170px;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .person-row { display: flex; align-items: center; gap: 8px; padding: 4px 6px; font-size: 14px; white-space: nowrap; }
      .person-dot { width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0; }
      .person-name { margin-right: auto; }
      .person-tag {
        font-size: 11px;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 1px 6px;
      }
      .body {
        display: grid;
        grid-template-columns: 1fr 320px;
        gap: 0 20px;
        align-items: start;
      }
      .sidebar {
        position: sticky;
        top: 0;
        max-height: 100vh;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        background: #fff;
        border-left: 1px solid var(--line);
        min-height: calc(100vh - 45px);
      }
      .sidebar h2 { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 8px; }
      .sidebar ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
      .sidebar .empty { color: var(--muted); font-size: 14px; margin: 0; }
      .chat-box { display: flex; flex-direction: column; flex: 1; min-height: 0; }
      .chat {
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow-y: auto;
        flex: 1;
        min-height: 120px;
        padding: 2px;
      }
      .bubble {
        max-width: 85%;
        padding: 8px 12px;
        border-radius: 14px;
        font-size: 14px;
        line-height: 1.4;
        display: flex;
        flex-direction: column;
        gap: 2px;
        position: relative;
      }
      .bubble .words { white-space: pre-wrap; overflow-wrap: break-word; }
      .bubble .who { font-size: 12px; font-weight: 600; }
      .bubble .hint { font-size: 12px; opacity: 0.75; }
      .bubble.user {
        align-self: flex-end;
        border-bottom-right-radius: 4px;
        background: #fff;
        border: 1.5px solid var(--line);
      }
      .bubble.user.mine {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .bubble.agent {
        align-self: flex-start;
        border-bottom-left-radius: 4px;
        background: var(--paper);
        border: 1px solid var(--line);
      }
      .bubble.agent .hint { color: var(--muted); }
      .bubble.working { color: var(--muted); }
      .bubble.queued { opacity: 0.75; border-style: dashed; }
      .bubble.queued.mine { border-style: solid; }
      .bubble .unpin {
        position: absolute;
        top: -7px;
        left: -7px;
        width: 18px;
        height: 18px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--muted);
        font-size: 11px;
        line-height: 1;
        cursor: pointer;
        padding: 0;
      }
      .chip {
        align-self: center;
        font-size: 12px;
        font-weight: 600;
        color: var(--accent);
        border: 1px solid var(--accent);
        border-radius: 999px;
        padding: 2px 10px;
      }
      .message-composer { display: flex; gap: 8px; align-items: flex-end; }
      .message-composer textarea {
        flex: 1;
        resize: none;
        min-height: 38px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        font: inherit;
        font-size: 14px;
      }
      .queue-button {
        padding: 9px 14px;
        border: 0;
        border-radius: 10px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      .verdict-row {
        display: flex;
        gap: 8px;
        align-items: baseline;
        padding: 10px;
        border: 1px solid var(--accent);
        border-radius: 6px;
        color: var(--accent);
      }
      .send select {
        width: 100%;
        padding: 8px;
        margin-bottom: 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
      }
      .send-button {
        width: 100%;
        padding: 10px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font-size: 15px;
        cursor: pointer;
      }
      .send .note { color: var(--muted); font-size: 13px; min-height: 1em; margin: 6px 0 0; }
      .grant-row { display: flex; gap: 8px; align-items: center; padding: 4px 0; cursor: pointer; }
      .end-button {
        padding: 8px;
        border: 1px solid #a33;
        border-radius: 6px;
        background: #fff;
        color: #a33;
        cursor: pointer;
        margin-top: auto;
      }
      .plan {
        max-width: 760px;
        margin: 28px auto;
        padding: 32px 40px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        line-height: 1.6;
      }
      .plan pre {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 12px;
        overflow-x: auto;
      }
      .plan code { font-size: 0.92em; }
      .plan a { color: var(--accent); }
      .join, .notice {
        max-width: 380px;
        margin: 15vh auto;
        padding: 32px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        text-align: center;
      }
      .join form { display: flex; flex-direction: column; gap: 12px; }
      .join input {
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        font-size: 15px;
      }
      .join button {
        padding: 10px;
        border: 0;
        border-radius: 6px;
        background: var(--accent);
        color: #fff;
        font-size: 15px;
        cursor: pointer;
      }
      .error { color: #a33; min-height: 1em; margin: 0; }
      .stamp-toggle {
        padding: 4px 12px;
        border: 1px solid var(--accent);
        border-radius: 999px;
        background: #fff;
        color: var(--accent);
        cursor: pointer;
        font-size: 13px;
      }
      .stamp-toggle.on { background: var(--accent); color: #fff; }
      .stamp-hover {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
        border-radius: 6px;
        cursor: pointer;
      }
      /* Keep .stamped after .stamp-hover: equal specificity, and a
         stamped block under the cursor must win the author color. */
      .stamped {
        outline: 2px solid;
        outline-offset: 4px;
        border-radius: 6px;
        cursor: pointer;
      }
      mark.pin {
        background: rgba(90, 95, 158, 0.14);
        text-decoration: underline;
        text-decoration-thickness: 2px;
        text-underline-offset: 3px;
        cursor: pointer;
      }
      .composer, .card {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 8px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 6px;
        box-shadow: 0 4px 14px rgba(43, 46, 58, 0.12);
        z-index: 10;
      }
      .composer input {
        width: 260px;
        padding: 6px 8px;
        border: 1px solid var(--line);
        border-radius: 4px;
      }
      .composer button, .remove {
        padding: 6px 10px;
        border: 0;
        border-radius: 4px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      .instruction { display: flex; gap: 8px; align-items: baseline; }
      .instruction .author { font-weight: 600; }
      .ended {
        text-align: center;
        color: var(--muted);
        padding-bottom: 32px;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
